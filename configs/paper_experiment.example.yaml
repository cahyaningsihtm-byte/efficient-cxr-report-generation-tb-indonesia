# Public experiment metadata template. Machine-specific paths, clinical data,
# and private adapter weights are intentionally not included.
experiment_name: ema_miccai_2026_camera_ready
task: Indonesian chest X-ray report generation for TB-screening support
fold:
  train: 1
  test: 0
teacher:
  display_name: Qwen3.5-9B
  runtime_model_id: Qwen/Qwen3.5-9B
  weights_url: https://huggingface.co/Qwen/Qwen3.5-9B
  local_checkpoint_directory: qwen3.5-9b
  architecture: Qwen3_5ForConditionalGeneration
  revision: not_recovered_from_local_checkpoint_copy
  local_config:
    model_type: qwen3_5
    transformers_version: 4.57.0.dev0
  model_identity_note: Qwen3.5 multimodal vision-language model; not the historical Qwen-VL release.
  precisions: [fp16, int8, int4]
student:
  display_name: CheXAgent with LoRA
  base_model_id: StanfordAIMI/CheXagent-2-3b
  weights_url: https://huggingface.co/StanfordAIMI/CheXagent-2-3b
  adapter:
    release_status: not_publicly_released
    adapter_config_source: local adapter_config.json from the paper run
    base_model_name_or_path: chexagent-2-3b
    peft_type: LORA
    task_type: CAUSAL_LM
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    revision: null
    target_modules_count: 168
evaluation:
  label_set: TB-14
  threshold: 0.5
  prompt_modes: [native, prompted]
  max_new_tokens: 256
hardware:
  accelerator: NVIDIA L4
  record_latency_as: median seconds per report, excluding model-load time
privacy:
  dataset_public: false
  patient_level_outputs_public: false
